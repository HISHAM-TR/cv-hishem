        item.mesh.scale.set(sc, sc, sc * 1.5);
      });

      // Stream Outbound Packets (along curveOut)
      outPackets.forEach(function(item) {
        var t = (item.offset + packetProgress * 1.15) % 1.0;
        var pt = curveOut.getPointAt(t);
        var tgt = curveOut.getTangentAt(t);
        item.mesh.position.copy(pt);
        item.mesh.lookAt(pt.clone().add(tgt));

        var sc = t < 0.12 ? (t / 0.12) : (t > 0.85 ? (1.0 - t) / 0.15 : 1.0);
        item.mesh.scale.set(sc, sc, sc * 1.5);
      });

      // Particles ambient drift
      particles.rotation.y -= 0.04 * delta;

      // Smooth camera parallax
      camera.position.x += (11 + mouseX * 2.5 - camera.position.x) * 0.05;
      camera.position.y += (7 - mouseY * 2.5 - camera.position.y) * 0.05;
      camera.lookAt(0, 0, 0);

      renderer.render(scene, camera);

    animate();

      cancelAnimationFrame(reqId);
      window.removeEventListener('resize', onResize);

      container.removeEventListener('touchstart', onTouchStart);

      window.removeEventListener('touchend', onTouchEnd);
      renderer.dispose();

      html = html.replace(/\/\*__DEF_START__\*\/[\s\S]*?\/\*__DEF_END__\*\//, newDef);

      </div>` : null}
    </div>

    <div className="p-4 border-t border-matrix-green/20 bg-matrix-dark flex gap-2">
      <button onClick=${saveLocal} className="flex-1 py-2.5 rounded-xl bg-white/10 hover:bg-white/15 text-white font-bold text-xs transition-colors">
        حفظ مؤقت
      </button>
      <button onClick=${saveToCode} className="flex-1 py-2.5 rounded-xl bg-matrix-green hover:bg-matrix-bright text-black font-bold text-xs transition-colors matrix-glow-btn">
        حفظ في الكود (index.html)
      </button>
    </div>
  </div>`;
}

/* ========================================================
   Root Application
   ======================================================== */
function App() {
  var soundS = uS(false);
  var soundOn = soundS[0], setSoundOn = soundS[1];
  var mobileOpenS = uS(false);
  var mobileOpen = mobileOpenS[0], setMobileOpen = mobileOpenS[1];
  var actS = uS('hero');
  var act = actS[0], setAct = actS[1];
  var toastS = uS({ show: false, msg: '', type: 'success' });
  var toast = toastS[0], setToast = toastS[1];

  var loginOpenS = uS(false);
  var loginOpen = loginOpenS[0], setLoginOpen = loginOpenS[1];
  var adminOpenS = uS(false);
  var adminOpen = adminOpenS[0], setAdminOpen = adminOpenS[1];

  var dataS = uS(function() {
    var base = JSON.parse(JSON.stringify(DEF));
    try {
      var saved = SS.g('siteData_v2');
      if (saved) {
        var obj = JSON.parse(saved);
        if (obj && obj._v === base._v) {
          for (var k in base) {
            if (!(k in obj)) obj[k] = base[k];
          }
          return obj;
        }
      }
    } catch(e) {}
    return base;
  });
  var data = dataS[0], setData = dataS[1];

  // Active section scroll tracking
  uE(function() {
    var sections = NAV.map(function(item) { return document.getElementById(item.id); }).filter(Boolean);
    var obs = new IntersectionObserver(function(entries) {
      entries.forEach(function(e) {
        if (e.isIntersecting) setAct(e.target.id);
      });
    }, { rootMargin: '-25% 0px -65% 0px' });
    sections.forEach(function(s) { obs.observe(s); });
    return function() { obs.disconnect(); };
  }, []);

  // Admin Shortcut (Ctrl+Shift+A)
  uE(function() {
    function onKeyDown(e) {
      if (e.ctrlKey && e.shiftKey && (e.key === 'a' || e.key === 'A')) {
        e.preventDefault();
        setLoginOpen(true);
      }
    }
    window.addEventListener('keydown', onKeyDown);
    return function() { window.removeEventListener('keydown', onKeyDown); };
  }, []);

  return h`<div className="min-h-screen text-slate-100 relative">
    <!-- Matrix Digital Rain Canvas Background -->
    <${MatrixRain}/>

    <!-- Navbar -->
    <${Navbar}
      d=${data}
      soundOn=${soundOn}
      setSoundOn=${setSoundOn}
      act=${act}
      mobileOpen=${mobileOpen}
      setMobileOpen=${setMobileOpen}
    />

    <!-- Main Content -->
    <main className="relative z-10">
      <${Hero} d=${data}/>
      <${AboutSection} d=${data}/>
      <${SkillsSection} d=${data}/>
      <${ProjectsSection} d=${data}/>
      <${CareerJourney} d=${data}/>
      <${ContactSection} d=${data} setT=${setToast}/>
    </main>

    <!-- Footer -->
    <${Footer} d=${data} onOpenAdmin=${function(){ setLoginOpen(true); }}/>

    <!-- Admin Login Modal -->
    ${loginOpen ? h`<${LoginModal}
      onClose=${function(){ setLoginOpen(false); }}
      onSuccess=${function(){ setLoginOpen(false); setAdminOpen(true); }}
    />` : null}

    <!-- Admin Drawer -->
    ${adminOpen ? h`<${AdminDrawer}
      d=${data}
      setD=${setData}
      setT=${setToast}
      onClose=${function(){ setAdminOpen(false); }}
      onLogout=${function(){ setAdminOpen(false); }}
    />` : null}

    <!-- Toast Notifications -->
    ${toast.show ? h`<div className="fixed bottom-6 left-6 z-[150] px-5 py-3 rounded-2xl matrix-hud border border-matrix-green/40 text-matrix-green text-xs font-mono shadow-2xl flex items-center gap-2">
      <${Ic} name="checkCircle" size=${16}/>
      <span>${toast.msg}</span>
    </div>` : null}
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(h`<${App}/>`);
</script>
</body>
